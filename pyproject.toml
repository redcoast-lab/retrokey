[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrokey"
version = "0.2.0"
description = "Convert Japanese text into physical key sequences for retro Japanese computers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
retrokey = "retrokey.cli:main"

[project.gui-scripts]
retrokey-gui = "retrokey.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
