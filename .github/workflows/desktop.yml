name: Test and build desktop apps

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Native GUI and clipboard smoke test
        run: python -m retrokey.gui --smoke-test gui-smoke.json
      - name: Check smoke result
        run: python -c "import json; assert json.load(open('gui-smoke.json'))['ok']"

  build:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r packaging/requirements.txt
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: retrokey-${{ matrix.os }}
          path: dist/retrokey-*.zip
          if-no-files-found: error

  release-assets:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read application version
        id: version
        shell: bash
        run: python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; open(os.environ['GITHUB_OUTPUT'],'a').write('tag=v'+v+'\\n')"
      - uses: actions/download-artifact@v4
        with:
          pattern: retrokey-*
          path: release-assets
          merge-multiple: true
      - name: Create release and attach apps
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || steps.version.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$COMMIT_SHA" --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber
